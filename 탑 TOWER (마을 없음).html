for(const g in GODS)RWK['bless_'+g]={n:GODS[g].n+'의 가호',i:GODS[g].i,c:GODS[g].c};
const isBless=k=>!!k&&k.startsWith('bless_');
const boonOK=b=>(BLS()[b.id]||0)<(b.max||BOON_MAX)&&(!b.need||b.need());                 // max 를 지정한 가호만 상한 적용(기본 상한 없음), 등장 조건(need)을 만족하는 가호
const reqOK=r=>{const q=RQ();return !q.id||(q.id===r.id&&!!r.lvup)};          // 요청을 갖고 있으면 '다른 요청' 카드는 나오지 않고, 보유 중인 요청의 레벨업 카드만 나온다 (clearRequest() 로 지우면 다시 모든 요청이 나옴)
const reqAvail=g=>(GODS[g].reqs||[]).some(reqOK);
const blessLeft=g=>GODS[g].boons.filter(boonOK).length+(GODS[g].reqs||[]).filter(reqOK).length;

// ---- 빌드 쏠림: 많이 고른 행일수록 출현 확률을 살짝 올림 ----
const buildPicks=g=>GODS[g].boons.reduce((n,b)=>n+(BLS()[b.id]||0),0)+(RQ().el===g?(RQ().lv||1):0);
const godWeight=g=>1+Math.min(BUILD_BIAS.max,Math.max(0,buildPicks(g)-BUILD_BIAS.start+1)*BUILD_BIAS.step);
function wpick(keys){const w=keys.map(k=>godWeight(k.slice(6)));let r=Math.random()*w.reduce((u,v)=>u+v,0);for(let i=0;i<keys.length;i++){r-=w[i];if(r<=0)return keys[i]}return keys[keys.length-1]}

// ---- 보상 생성: 가호 확률 + 행 선택 (문 두 개는 서로 다른 보상이므로 행도 겹치지 않음) ----
function genRw(ex,f){const hm=!G.hmDone&&!ex&&!isBoss(f)&&f>=G.hmAt&&!(G.rw&&G.rw.k==='weapon')&&pickUpgrades().length>0;
if(hm)return{k:'weapon',v:1};
if(ex!=='okru'&&Math.random()<OKRU_RATE)return{k:'okru',v:1};   // 옥루: 아주 가끔 등장하는 희귀 보상 (두 문에 동시에 나오지 않음)
const gk=Object.keys(GODS).filter(g=>blessLeft(g)>0).map(g=>'bless_'+g).filter(k=>k!==ex);
if(gk.length&&Math.random()<BLESS_RATE)return{k:wpick(gk),v:1};
const ks=Object.keys(RWK).filter(k=>k!==ex&&k!=='weapon'&&!isBless(k)&&k!=='okru'),k=ks[Math.floor(Math.random()*ks.length)];
return{k,v:k==='hp'?10:k==='gold'?20+f*8:1}}

// ---- 줍기: 해당 행의 가호 3택 (보유 가호는 레벨업 카드로, 요청 미선택이면 일정 확률로 요청 카드 1장 포함) ----
function pickBoons(g){const Gd=GODS[g],B=BLS(),q=RQ();
 const card=b=>{const cur=b.rep?0:(B[b.id]||0),nx=cur+1,ds=typeof b.d==='function'?b.d(nx):b.d;
  return{id:b.id,base:b.n,lvl:nx,up:cur>0,n:cur?`${b.n} Lv.${nx}`:b.n,d:(cur?`Lv.${cur} → Lv.${nx}\n`:'')+ds,i:Gd.i,god:g,f:()=>{if(!b.rep)B[b.id]=nx;b.f(nx)}}};
 const rcard=r=>{const own=q.id===r.id,cur=own?(q.lv||1):0,nx=cur+1,tx=s=>typeof s==='function'?s(nx):s;
  return{id:r.id,base:r.n,lvl:nx,up:own,rq:1,n:own?`${r.n} Lv.${nx}`:r.n,
   d:(own?`Lv.${cur} → Lv.${nx}\n`:(q.id&&q.id!==r.id?'(기존 요청 교체)\n':''))+`약: ${tx(r.dw)}\n강: ${tx(r.ds)}`,i:Gd.i,god:g,f:()=>reqSelect(g,r)}};
 // 가호 카드 + 요청 카드를 한 풀에 넣고 동일 확률로 3장 추첨
 const pool=Gd.boons.filter(boonOK).map(card).concat((Gd.reqs||[]).filter(reqOK).map(rcard));
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}   // Fisher-Yates (sort 셔플은 뒤쪽 카드가 덜 뽑히는 편향이 있음)
